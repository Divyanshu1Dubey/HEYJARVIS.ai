[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "heyjarvis"
version = "0.1.0"
description = "AI-Powered Patient Recapture & Revenue Recovery for Dental Practices"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "HeyJarvis", email = "hello@heyjarvis.ai"},
]
keywords = ["dental", "ai", "recapture", "revenue-recovery", "healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Healthcare Industry",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",

    # HTTP
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",

    # Task Queue
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",

    # AI / LLM
    "anthropic>=0.18.0",
    "tiktoken>=0.6.0",

    # Communication (mocked in dev)
    "twilio>=8.10.0",
    "postmarker>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pydash>=7.0.0",
    "phonenumbers>=8.13.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",

    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.4.0",
    "black>=23.10.0",
]

[project.urls]
Homepage = "https://heyjarvis.ai"
Documentation = "https://docs.heyjarvis.ai"
Repository = "https://github.com/heyjarvis/heyjarvis"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "shared*"]

[tool.setuptools.package-data]
"*" = ["*.py", "*.md", "*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py311"]
